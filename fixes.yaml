# Machine-readable registry of fixes in this repo.
# The README tables must agree with it: tools/check-readme-sync.py checks that in CI,
# and tools/verify-patches.sh checks the patches.
#
# reviewed_at is the date the live trackers were last read. "standard" is the state of
# the regular (non-ESM) pocket; standard_published is the newest version Launchpad
# publishes there for that series, i.e. what a machine without Ubuntu Pro gets.
fixes:
  - cve: CVE-2025-11021        # + CVE-2025-4945 (same patch)
    reviewed_at: "2026-09-29"
    status_source: https://ubuntu.com/security/CVE-2025-11021
    package: libsoup3
    component: universe
    severity: high             # CVSS 7.5 (Ubuntu priority: medium)
    summary: OOB read in cookie date parsing (integer overflow in parse_timezone)
    affected: [jammy]
    esm: { jammy: "released (3.0.7-0ubuntu1+esm5)" }
    standard: { jammy: needed }
    standard_published: { jammy: "3.0.7-0ubuntu1 (jammy-updates, 2022-07-28)" }
    upstream: https://gitlab.gnome.org/GNOME/libsoup/-/merge_requests/473
    applied_upstream: "3.4.0"
    debian_bug: 1116469        # closed and archived; fixed in unstable 3.6.5-5
    debian_status: "fixed in forky/sid (3.6.6-1); bookworm and trixie vulnerable, no-dsa"
    launchpad_bug: 2157576     # 404 when logged out on 2026-09-29: private or not public
    patch: libsoup3/CVE-2025-11021-CVE-2025-4945.patch
    notes: >-
      Ubuntu cites MR !473 for both CVEs. Debian cites MR !482
      (commit 9e1a427d, NULL checks in soup_date_time_to_string and
      serialize_cookie) as the fix for CVE-2025-11021 and still lists trixie
      3.6.5-3 as vulnerable, although that version already has !473. The patch
      here carries !473 only; check whether !482 belongs in it before claiming
      full coverage of CVE-2025-11021.
    sources:
      - https://ubuntu.com/security/CVE-2025-11021
      - https://ubuntu.com/security/CVE-2025-4945
      - https://security-tracker.debian.org/tracker/CVE-2025-11021
      - https://security-tracker.debian.org/tracker/CVE-2025-4945
      - https://launchpad.net/ubuntu/+source/libsoup3/+publishinghistory

