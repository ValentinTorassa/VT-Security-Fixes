    standard_published:
      jammy: "1.34-1build2 (release pocket, 2022-03-02)"
      noble: "1.34-2build3 (release pocket, 2024-04-03)"
    upstream: https://github.com/cpan-authors/YAML-Syck/commit/dcf4c8477b82ef439f43fd20dc099082d096df02
    applied_upstream: "1.36"
    debian_status: "fixed in bookworm (1.34-2+deb12u1), trixie (1.34-2+deb13u1) and sid"
    launchpad_bug: 2157577     # 404 when logged out on 2026-09-29: private or not public
    patch: libyaml-syck-perl/CVE-2025-11683.patch
    notes: >-
      The Ubuntu tracker lists resolute as "needed", but resolute publishes
      1.36-1, which already contains the upstream fix; treated as tracker lag,
