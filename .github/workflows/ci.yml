name: Verify patches
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19; change the image on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: for f in tools/*.sh; do bash -n "$f"; done
      - run: bash tools/verify-patches.sh
      - run: python3 tools/check-readme-sync.py
